openapi: 3.1.0
info:
  title: EstateOS API
  version: 0.5.0
  description: Phase 5 contract — Rental Reliability Engine, Explainable Recommendations, Yield & Operational Analytics.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000/api
    description: Local API Server

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealthStatus
      description: Returns 200 if the API can reach the database.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db, timestamp]
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [connected] }
                  timestamp: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/BadRequestError"
        "503":
          description: Degraded — DB unreachable
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [degraded] }
                  db: { type: string, enum: [disconnected] }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                role: { type: string, enum: [OWNER, RENTER], default: RENTER }
                phone: { type: string, minLength: 10, maxLength: 15 }
      responses:
        "201":
          description: User registered successfully
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly refresh token cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in successfully
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly refresh token cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token (with token rotation)
      operationId: refreshSession
      security: []
      responses:
        "200":
          description: New access token generated
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Rotated HttpOnly refresh token cookie
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: User logout
      operationId: logoutUser
      security: []
      responses:
        "200":
          description: Logged out and cookie cleared
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /properties:
    get:
      tags: [Properties]
      summary: Public marketplace property search
      operationId: searchProperties
      security: []
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: locality
          in: query
          schema: { type: string }
        - name: propertyType
          in: query
          schema: { type: string, enum: [APARTMENT, HOUSE, VILLA, STUDIO, PLOT, COMMERCIAL] }
        - name: furnishing
          in: query
          schema: { type: string, enum: [UNFURNISHED, SEMI_FURNISHED, FULLY_FURNISHED] }
        - name: bedrooms
          in: query
          schema: { type: integer }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 12 }
        - name: sortBy
          in: query
          schema: { type: string, enum: [price_asc, price_desc, newest], default: newest }
      responses:
        "200":
          description: Filtered property list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

    post:
      tags: [Properties]
      summary: Create new property listing (Owner only)
      operationId: createProperty
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyCreate"
      responses:
        "201":
          description: Property created
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /properties/mine:
    get:
      tags: [Properties]
      summary: Get properties owned by current user
      operationId: getMyProperties
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Owner's properties
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /properties/{id}:
    get:
      tags: [Properties]
      summary: Get property listing details by ID
      operationId: getPropertyById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Property details
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Properties]
      summary: Update property listing (Owner only)
      operationId: updateProperty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Property updated
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Properties]
      summary: Soft-delete property listing (Owner only)
      operationId: deleteProperty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Property deleted
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /properties/{id}/publish:
    patch:
      tags: [Properties]
      summary: Toggle publish status between ACTIVE and DRAFT (Owner only)
      operationId: togglePublishProperty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status toggled
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /properties/{id}/images:
    post:
      tags: [Properties]
      summary: Upload photo to Cloudinary
      operationId: uploadPropertyImage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /properties/{id}/images/{imageId}:
    delete:
      tags: [Properties]
      summary: Delete photo from Cloudinary
      operationId: deletePropertyImage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Image removed
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /favourites:
    get:
      tags: [Favourites]
      summary: Get current user's saved properties
      operationId: getFavourites
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of saved properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FavouriteResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /favourites/{propertyId}:
    post:
      tags: [Favourites]
      summary: Add property to saved favourites
      operationId: addFavourite
      security:
        - BearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Property added to favourites
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Favourites]
      summary: Remove property from favourites
      operationId: removeFavourite
      security:
        - BearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Property removed from favourites
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /enquiries:
    post:
      tags: [Enquiries]
      summary: Submit enquiry on a property
      operationId: createEnquiry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryCreate"
      responses:
        "201":
          description: Enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    get:
      tags: [Enquiries]
      summary: List enquiries (role-aware)
      operationId: listEnquiries
      security:
        - BearerAuth: []
      parameters:
        - name: propertyId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnquiryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /enquiries/{id}:
    get:
      tags: [Enquiries]
      summary: Get enquiry details
      operationId: getEnquiryById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Enquiry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Enquiries]
      summary: Update enquiry status and private owner notes (Owner only)
      operationId: updateEnquiry
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryUpdate"
      responses:
        "200":
          description: Enquiry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /appointments:
    post:
      tags: [Appointments]
      summary: Schedule a property visit appointment
      operationId: createAppointment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
      responses:
        "201":
          description: Appointment created and enquiry transitioned to VISIT_SCHEDULED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    get:
      tags: [Appointments]
      summary: List visit appointments for current user
      operationId: listAppointments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of visit appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /appointments/{id}:
    patch:
      tags: [Appointments]
      summary: Update appointment status (Confirm, Complete, Cancel)
      operationId: updateAppointment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /leases:
    post:
      tags: [Leases]
      summary: Create a lease (Owner)
      operationId: createLease
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseCreate"
      responses:
        "201":
          description: Lease created with initial obligations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          description: Overlapping active lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [Leases]
      summary: List user leases (Owner or Tenant)
      operationId: getLeases
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of accessible leases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaseResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /leases/{id}:
    get:
      tags: [Leases]
      summary: Get lease by ID
      operationId: getLeaseById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lease details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags: [Leases]
      summary: Update lease status (Owner)
      operationId: updateLeaseStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseStatusUpdate"
      responses:
        "200":
          description: Lease status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /leases/{id}/accept:
    post:
      tags: [Leases]
      summary: Electronically accept a lease (Tenant)
      operationId: acceptLease
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseAccept"
      responses:
        "200":
          description: Lease accepted and locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /leases/{id}/obligations:
    get:
      tags: [Leases]
      summary: Get rent obligations with derived payment status
      operationId: getLeaseObligations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Computed rent obligations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentObligationResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /payments:
    post:
      tags: [Payments]
      summary: Record a rent payment with FIFO allocation (Owner)
      operationId: recordPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: Payment recorded and allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    get:
      tags: [Payments]
      summary: List recorded payments
      operationId: getPayments
      security:
        - BearerAuth: []
      parameters:
        - name: leaseId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Payment list with allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /maintenance:
    post:
      tags: [Maintenance]
      summary: Submit a maintenance ticket (Tenant)
      operationId: createMaintenance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceCreate"
      responses:
        "201":
          description: Maintenance ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

    get:
      tags: [Maintenance]
      summary: List maintenance requests
      operationId: getMaintenanceList
      security:
        - BearerAuth: []
      parameters:
        - name: propertyId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [REPORTED, ACKNOWLEDGED, IN_PROGRESS, RESOLVED, CANCELLED]
      responses:
        "200":
          description: Filtered maintenance tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /maintenance/{id}:
    get:
      tags: [Maintenance]
      summary: Get maintenance ticket with audit log
      operationId: getMaintenanceById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Maintenance ticket details with full update history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags: [Maintenance]
      summary: Update maintenance ticket status with note (Owner)
      operationId: updateMaintenanceStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceStatusUpdate"
      responses:
        "200":
          description: Ticket status updated with immutable update logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /notifications:
    get:
      tags: [Notifications]
      summary: Get user notifications with unread count
      operationId: getNotifications
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User notification inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark single notification as read
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /dashboard/owner:
    get:
      tags: [Dashboard]
      summary: Get Owner Dashboard Signals & Intelligence
      operationId: getOwnerDashboard
      description: Returns occupancy, collection rate, income trend, audit logs, and priority-ranked signals.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Owner dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDashboardResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /dashboard/tenant:
    get:
      tags: [Dashboard]
      summary: Get Tenant Dashboard
      operationId: getTenantDashboard
      description: Returns tenant active lease, next upcoming obligation, and maintenance status.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tenant dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDashboardResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /recommendations:
    get:
      tags: [Recommendations]
      summary: Get Explainable Property Recommendations
      operationId: getRecommendations
      description: Returns content-based recommendations derived strictly from user's favourites and enquiries.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recommendations response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /properties/{id}/yield:
    get:
      tags: [Properties]
      summary: Get Gross Rental Yield Estimate
      operationId: getPropertyYield
      description: Calculates gross yield against locality median active lease benchmarks with mandatory disclaimer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Yield estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YieldEstimate"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /properties/map:
    get:
      tags: [Properties]
      summary: Get Geo Pins for Map View
      operationId: getPropertyMapPins
      description: Returns lightweight coordinate and price payload for active listings.
      responses:
        "200":
          description: Map pins
          content:
            application/json:
              schema:
                type: object
                required: [properties]
                properties:
                  properties:
                    type: array
                    items:
                      type: object

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserPublic:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, OWNER, TENANT, RENTER] }
        phone: { type: [string, "null"] }

    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user: { $ref: "#/components/schemas/UserPublic" }
        accessToken: { type: string }

    PropertyCreate:
      type: object
      required: [title, description, price, city, locality, address, propertyType, bedrooms, bathrooms, areaSqft, furnishing]
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        price: { type: number, minimum: 1 }
        depositAmount: { type: [number, "null"] }
        city: { type: string }
        locality: { type: string }
        address: { type: string }
        pincode: { type: [string, "null"] }
        propertyType: { type: string, enum: [APARTMENT, HOUSE, VILLA, STUDIO, PLOT, COMMERCIAL] }
        bedrooms: { type: integer, minimum: 0, maximum: 20 }
        bathrooms: { type: integer, minimum: 0, maximum: 20 }
        areaSqft: { type: integer, minimum: 1 }
        furnishing: { type: string, enum: [UNFURNISHED, SEMI_FURNISHED, FULLY_FURNISHED] }
        amenities: { type: array, items: { type: string } }
        availability: { type: string, enum: [AVAILABLE_NOW, AVAILABLE_SOON, NOT_AVAILABLE], default: AVAILABLE_NOW }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }

    PropertyListResponse:
      type: object
      required: [properties, total, page, limit, totalPages]
      properties:
        properties:
          type: array
          items:
            type: object
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

    FavouriteResponse:
      type: object
      required: [userId, propertyId, createdAt]
      properties:
        userId: { type: string }
        propertyId: { type: string }
        createdAt: { type: string, format: date-time }
        property: { type: [object, "null"] }

    EnquiryCreate:
      type: object
      required: [propertyId, message]
      properties:
        propertyId: { type: string }
        message: { type: string, minLength: 5, maxLength: 1000 }

    EnquiryUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [NEW, CONTACTED, VISIT_SCHEDULED, NEGOTIATING, CLOSED_WON, CLOSED_LOST]
        ownerNotes:
          type: [string, "null"]

    EnquiryResponse:
      type: object
      required: [id, userId, propertyId, message, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        propertyId: { type: string }
        message: { type: string }
        status:
          type: string
          enum: [NEW, CONTACTED, VISIT_SCHEDULED, NEGOTIATING, CLOSED_WON, CLOSED_LOST]
        ownerNotes:
          type: [string, "null"]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        user: { type: [object, "null"] }
        property: { type: [object, "null"] }
        appointments: { type: array, items: { type: object } }

    AppointmentCreate:
      type: object
      required: [enquiryId, visitAt]
      properties:
        enquiryId: { type: string }
        visitAt: { type: string, format: date-time }
        notes: { type: [string, "null"] }

    AppointmentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [PROPOSED, CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED, NO_SHOW]
        visitAt:
          type: [string, "null"],
          format: date-time
        notes:
          type: [string, "null"]

    AppointmentResponse:
      type: object
      required: [id, enquiryId, visitAt, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        enquiryId: { type: string }
        visitAt: { type: string, format: date-time }
        status:
          type: string
          enum: [PROPOSED, CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED, NO_SHOW]
        notes: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        enquiry: { type: [object, "null"] }

    LeaseCreate:
      type: object
      required: [propertyId, tenantId, startDate, endDate, rentAmount, dueDay]
      properties:
        propertyId: { type: string }
        tenantId: { type: string }
        enquiryId: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        rentAmount: { type: number, minimum: 1 }
        depositAmount: { type: number, minimum: 0 }
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        documentUrl: { type: string, format: uri }

    LeaseAccept:
      type: object
      required: [acceptedByName]
      properties:
        acceptedByName: { type: string, minLength: 2, maxLength: 100 }
        signatureDataUrl: { type: string }

    LeaseStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING_ACCEPTANCE, ACTIVE, ENDED, TERMINATED]
        endDate:
          type: string
          format: date-time

    LeaseResponse:
      type: object
      required: [id, propertyId, tenantId, startDate, endDate, rentAmount, dueDay, status, acceptanceStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenantId: { type: string }
        enquiryId: { type: [string, "null"] }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        rentAmount: { type: number }
        depositAmount: { type: [number, "null"] }
        dueDay: { type: integer }
        status:
          type: string
          enum: [PENDING_ACCEPTANCE, ACTIVE, ENDED, TERMINATED]
        acceptanceStatus:
          type: string
          enum: [NOT_SENT, SENT_TO_TENANT, ACCEPTED_BY_TENANT, DECLINED_BY_TENANT]
        acceptedByName: { type: [string, "null"] }
        acceptedByTenantAt: { type: [string, "null"], format: date-time }
        signatureDataUrl: { type: [string, "null"] }
        documentUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        property:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            city: { type: string }
            price: { type: number }
            address: { type: string }
            ownerId: { type: string }
        tenant:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: [string, "null"] }

    RentObligationResponse:
      type: object
      required: [id, leaseId, dueDate, amountDue, amountPaid, balance, status, daysOverdue]
      properties:
        id: { type: string }
        leaseId: { type: string }
        dueDate: { type: string, format: date-time }
        amountDue: { type: number }
        amountPaid: { type: number }
        balance: { type: number }
        status:
          type: string
          enum: [PENDING, PARTIAL, PAID, OVERDUE, WAIVED]
        daysOverdue: { type: integer, minimum: 0 }

    PaymentCreate:
      type: object
      required: [leaseId, amount, method]
      properties:
        leaseId: { type: string }
        amount: { type: number, minimum: 1 }
        paidAt: { type: string, format: date-time }
        method:
          type: string
          enum: [UPI, BANK_TRANSFER, CHEQUE, CASH, CREDIT_CARD, DEBIT_CARD, OTHER]
        reference: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 1000 }

    PaymentAllocationResponse:
      type: object
      required: [obligationId, amount]
      properties:
        id: { type: string }
        obligationId: { type: string }
        amount: { type: number }
        dueDate: { type: string, format: date-time }

    PaymentResponse:
      type: object
      required: [id, leaseId, amount, paidAt, method, allocations]
      properties:
        id: { type: string }
        leaseId: { type: string }
        amount: { type: number }
        paidAt: { type: string, format: date-time }
        method: { type: string }
        reference: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAllocationResponse"
        createdAt: { type: string, format: date-time }

    MaintenanceCreate:
      type: object
      required: [leaseId, title, description]
      properties:
        leaseId: { type: string }
        title: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          default: MEDIUM
        imageUrl: { type: string, format: uri }

    MaintenanceStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [REPORTED, ACKNOWLEDGED, IN_PROGRESS, RESOLVED, CANCELLED]
        note: { type: string, maxLength: 1000 }

    MaintenanceUpdateEntry:
      type: object
      required: [id, newStatus, updatedBy, createdAt]
      properties:
        id: { type: string }
        oldStatus:
          type: [string, "null"]
          enum: [REPORTED, ACKNOWLEDGED, IN_PROGRESS, RESOLVED, CANCELLED, null]
        newStatus:
          type: string
          enum: [REPORTED, ACKNOWLEDGED, IN_PROGRESS, RESOLVED, CANCELLED]
        note: { type: [string, "null"] }
        updatedBy:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }

    MaintenanceResponse:
      type: object
      required: [id, propertyId, tenantId, leaseId, title, description, status, priority, createdAt, ageInDays, updates]
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenantId: { type: string }
        leaseId: { type: string }
        title: { type: string }
        description: { type: string }
        imageUrl: { type: [string, "null"] }
        status:
          type: string
          enum: [REPORTED, ACKNOWLEDGED, IN_PROGRESS, RESOLVED, CANCELLED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
        ageInDays: { type: integer, minimum: 0 }
        property:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            city: { type: string }
        tenant:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
        updates:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceUpdateEntry"

    NotificationResponse:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        type:
          type: string
          enum: [ENQUIRY_RECEIVED, APPOINTMENT_REQUESTED, APPOINTMENT_CONFIRMED, LEASE_CREATED, LEASE_ACCEPTED, LEASE_ACTIVATED, PAYMENT_RECEIVED, RENT_OVERDUE, MAINTENANCE_REQUESTED, MAINTENANCE_STATUS_CHANGED]
        message: { type: string }
        link: { type: [string, "null"] }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationListResponse:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
        unreadCount: { type: integer, minimum: 0 }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [object, "null"] }

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
