openapi: 3.1.0
info:
  title: EstateOS API
  version: 0.1.0
  description: Phase 1 contract — health check only. Auth in Phase 2, properties in Phase 2, etc.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000/api
    description: Local API Server

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealthStatus
      description: Returns 200 if the API can reach the database.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db, timestamp]
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [connected] }
                  timestamp: { type: string, format: date-time }
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "503":
          description: Degraded — DB unreachable
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [degraded] }
                  db: { type: string, enum: [disconnected] }
