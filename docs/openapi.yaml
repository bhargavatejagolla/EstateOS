openapi: 3.0.3
info:
  title: EstateOS REST API
  description: Full-Lifecycle Rental Operations & Property Management Platform API Contract
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns API status, uptime, and database connectivity.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: estateos-api
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
                    example: 120
                  database:
                    type: string
                    example: connected

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      summary: Authenticate user & return JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/refresh:
    post:
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /properties:
    get:
      summary: Search and list properties with filters
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: city
          in: query
          schema:
            type: string
        - name: propertyType
          in: query
          schema:
            type: string
            enum: [APARTMENT, VILLA, STUDIO, COMMERCIAL]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Paginated properties
    post:
      summary: Create a new property (Owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyInput"
      responses:
        "201":
          description: Property created

  /properties/{id}:
    get:
      summary: Get property details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Property detail
    put:
      summary: Update property (Owner only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Property updated

  /enquiries:
    post:
      summary: Submit enquiry for a property (Tenant)
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Enquiry submitted
    get:
      summary: List user enquiries or owner property enquiries
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Enquiries list

  /appointments:
    post:
      summary: Schedule a viewing appointment
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Appointment scheduled
    get:
      summary: List appointments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Appointments list

  /leases:
    post:
      summary: Create a lease contract (Owner only)
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Lease created
    get:
      summary: List leases
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Leases list

  /rent-obligations:
    get:
      summary: Get rent obligations and payment schedules
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rent obligations list

  /payments:
    post:
      summary: Record rent payment with ledger allocation
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Payment allocated and recorded

  /maintenance-requests:
    post:
      summary: Submit a maintenance ticket (Tenant)
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Maintenance ticket submitted
    get:
      summary: List maintenance tickets
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Maintenance tickets list

  /dashboard/owner:
    get:
      summary: Computed Rental Reliability Engine metrics & signals
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Real-time owner metrics and proactive signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDashboardResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Invalid payload or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Alex Mercer
        email:
          type: string
          format: email
          example: alex@estateos.dev
        password:
          type: string
          example: StrongPass123!
        role:
          type: string
          enum: [OWNER, TENANT]
          default: TENANT
        phone:
          type: string
          example: "+919876543210"

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alex@estateos.dev
        password:
          type: string
          example: StrongPass123!

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        accessToken:
          type: string
        refreshToken:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [OWNER, TENANT, ADMIN]
        phone:
          type: string
          nullable: true

    CreatePropertyInput:
      type: object
      required: [title, description, propertyType, rentPrice, depositPrice, address, locality, city, state, bedrooms, bathrooms, areaSqft]
      properties:
        title:
          type: string
        description:
          type: string
        propertyType:
          type: string
          enum: [APARTMENT, VILLA, STUDIO, COMMERCIAL]
        rentPrice:
          type: number
        depositPrice:
          type: number
        address:
          type: string
        locality:
          type: string
        city:
          type: string
        state:
          type: string
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        areaSqft:
          type: integer
        furnishing:
          type: string
          enum: [UNFURNISHED, SEMI_FURNISHED, FULLY_FURNISHED]
        amenities:
          type: array
          items:
            type: string

    OwnerDashboardResponse:
      type: object
      properties:
        metrics:
          type: object
          properties:
            totalProperties:
              type: integer
            occupiedProperties:
              type: integer
            vacantProperties:
              type: integer
            occupancyRate:
              type: number
            monthlyProjectedIncome:
              type: number
            totalOverdueRent:
              type: number
            pendingMaintenanceCount:
              type: integer
            upcomingViewingsCount:
              type: integer
        signals:
          type: object
          properties:
            overdueObligations:
              type: array
              items:
                type: object
            expiringLeases:
              type: array
              items:
                type: object
            urgentMaintenance:
              type: array
              items:
                type: object

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
