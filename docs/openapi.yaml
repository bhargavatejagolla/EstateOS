openapi: 3.1.0
info:
  title: EstateOS API
  version: 0.3.0
  description: Phase 3 contract — Marketplace Discovery, Saved Homes, Enquiries Funnel, and Visit Appointments.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000/api
    description: Local API Server

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealthStatus
      description: Returns 200 if the API can reach the database.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db, timestamp]
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [connected] }
                  timestamp: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/BadRequestError"
        "503":
          description: Degraded — DB unreachable
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [degraded] }
                  db: { type: string, enum: [disconnected] }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                role: { type: string, enum: [OWNER, RENTER], default: RENTER }
                phone: { type: string, minLength: 10, maxLength: 15 }
      responses:
        "201":
          description: User registered successfully
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly refresh token cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in successfully
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly refresh token cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token (with token rotation)
      operationId: refreshSession
      security: []
      responses:
        "200":
          description: New access token generated
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Rotated HttpOnly refresh token cookie
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: User logout
      operationId: logoutUser
      security: []
      responses:
        "200":
          description: Logged out and cookie cleared
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /properties:
    get:
      tags: [Properties]
      summary: Public marketplace property search
      operationId: searchProperties
      security: []
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: locality
          in: query
          schema: { type: string }
        - name: propertyType
          in: query
          schema: { type: string, enum: [APARTMENT, HOUSE, VILLA, STUDIO, PLOT, COMMERCIAL] }
        - name: furnishing
          in: query
          schema: { type: string, enum: [UNFURNISHED, SEMI_FURNISHED, FULLY_FURNISHED] }
        - name: bedrooms
          in: query
          schema: { type: integer }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 12 }
        - name: sortBy
          in: query
          schema: { type: string, enum: [price_asc, price_desc, newest], default: newest }
      responses:
        "200":
          description: Filtered property list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

    post:
      tags: [Properties]
      summary: Create new property listing (Owner only)
      operationId: createProperty
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyCreate"
      responses:
        "201":
          description: Property created
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /properties/mine:
    get:
      tags: [Properties]
      summary: Get properties owned by current user
      operationId: getMyProperties
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Owner's properties
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /properties/{id}:
    get:
      tags: [Properties]
      summary: Get property listing details by ID
      operationId: getPropertyById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Property details
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Properties]
      summary: Update property listing (Owner only)
      operationId: updateProperty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Property updated
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Properties]
      summary: Soft-delete property listing (Owner only)
      operationId: deleteProperty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Property deleted
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /properties/{id}/publish:
    patch:
      tags: [Properties]
      summary: Toggle publish status between ACTIVE and DRAFT (Owner only)
      operationId: togglePublishProperty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status toggled
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /properties/{id}/images:
    post:
      tags: [Properties]
      summary: Upload photo to Cloudinary
      operationId: uploadPropertyImage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /properties/{id}/images/{imageId}:
    delete:
      tags: [Properties]
      summary: Delete photo from Cloudinary
      operationId: deletePropertyImage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Image removed
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /favourites:
    get:
      tags: [Favourites]
      summary: Get current user's saved properties
      operationId: getFavourites
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of saved properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FavouriteResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /favourites/{propertyId}:
    post:
      tags: [Favourites]
      summary: Add property to saved favourites
      operationId: addFavourite
      security:
        - BearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Property added to favourites
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Favourites]
      summary: Remove property from favourites
      operationId: removeFavourite
      security:
        - BearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Property removed from favourites
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /enquiries:
    post:
      tags: [Enquiries]
      summary: Submit enquiry on a property
      operationId: createEnquiry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryCreate"
      responses:
        "201":
          description: Enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    get:
      tags: [Enquiries]
      summary: List enquiries (role-aware)
      operationId: listEnquiries
      security:
        - BearerAuth: []
      parameters:
        - name: propertyId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnquiryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /enquiries/{id}:
    get:
      tags: [Enquiries]
      summary: Get enquiry details
      operationId: getEnquiryById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Enquiry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Enquiries]
      summary: Update enquiry status and private owner notes (Owner only)
      operationId: updateEnquiry
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryUpdate"
      responses:
        "200":
          description: Enquiry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /appointments:
    post:
      tags: [Appointments]
      summary: Schedule a property visit appointment
      operationId: createAppointment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
      responses:
        "201":
          description: Appointment created and enquiry transitioned to VISIT_SCHEDULED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    get:
      tags: [Appointments]
      summary: List visit appointments for current user
      operationId: listAppointments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of visit appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /appointments/{id}:
    patch:
      tags: [Appointments]
      summary: Update appointment status (Confirm, Complete, Cancel)
      operationId: updateAppointment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserPublic:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, OWNER, TENANT, RENTER] }
        phone: { type: [string, "null"] }

    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user: { $ref: "#/components/schemas/UserPublic" }
        accessToken: { type: string }

    PropertyCreate:
      type: object
      required: [title, description, price, city, locality, address, propertyType, bedrooms, bathrooms, areaSqft, furnishing]
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        price: { type: number, minimum: 1 }
        depositAmount: { type: [number, "null"] }
        city: { type: string }
        locality: { type: string }
        address: { type: string }
        pincode: { type: [string, "null"] }
        propertyType: { type: string, enum: [APARTMENT, HOUSE, VILLA, STUDIO, PLOT, COMMERCIAL] }
        bedrooms: { type: integer, minimum: 0, maximum: 20 }
        bathrooms: { type: integer, minimum: 0, maximum: 20 }
        areaSqft: { type: integer, minimum: 1 }
        furnishing: { type: string, enum: [UNFURNISHED, SEMI_FURNISHED, FULLY_FURNISHED] }
        amenities: { type: array, items: { type: string } }
        availability: { type: string, enum: [AVAILABLE_NOW, AVAILABLE_SOON, NOT_AVAILABLE], default: AVAILABLE_NOW }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }

    PropertyListResponse:
      type: object
      required: [properties, total, page, limit, totalPages]
      properties:
        properties:
          type: array
          items:
            type: object
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

    FavouriteResponse:
      type: object
      required: [userId, propertyId, createdAt]
      properties:
        userId: { type: string }
        propertyId: { type: string }
        createdAt: { type: string, format: date-time }
        property: { type: [object, "null"] }

    EnquiryCreate:
      type: object
      required: [propertyId, message]
      properties:
        propertyId: { type: string }
        message: { type: string, minLength: 5, maxLength: 1000 }

    EnquiryUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [NEW, CONTACTED, VISIT_SCHEDULED, NEGOTIATING, CLOSED_WON, CLOSED_LOST]
        ownerNotes:
          type: [string, "null"]

    EnquiryResponse:
      type: object
      required: [id, userId, propertyId, message, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        propertyId: { type: string }
        message: { type: string }
        status:
          type: string
          enum: [NEW, CONTACTED, VISIT_SCHEDULED, NEGOTIATING, CLOSED_WON, CLOSED_LOST]
        ownerNotes:
          type: [string, "null"]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        user: { type: [object, "null"] }
        property: { type: [object, "null"] }
        appointments: { type: array, items: { type: object } }

    AppointmentCreate:
      type: object
      required: [enquiryId, visitAt]
      properties:
        enquiryId: { type: string }
        visitAt: { type: string, format: date-time }
        notes: { type: [string, "null"] }

    AppointmentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [PROPOSED, CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED, NO_SHOW]
        visitAt:
          type: [string, "null"],
          format: date-time
        notes:
          type: [string, "null"]

    AppointmentResponse:
      type: object
      required: [id, enquiryId, visitAt, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        enquiryId: { type: string }
        visitAt: { type: string, format: date-time }
        status:
          type: string
          enum: [PROPOSED, CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED, NO_SHOW]
        notes: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        enquiry: { type: [object, "null"] }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [object, "null"] }

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
