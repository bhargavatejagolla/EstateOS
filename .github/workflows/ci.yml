name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: estateos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/estateos_test?schema=public
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/estateos_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_64_chars_0000000000000000000000000000000000000
      JWT_REFRESH_SECRET: ci_refresh_secret_64_chars_000000000000000000000000000000000000
      CLOUDINARY_CLOUD_NAME: ci_dummy
      CLOUDINARY_API_KEY: ci_dummy
      CLOUDINARY_API_SECRET: ci_dummy
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estateos/shared build

      - name: Generate Prisma client
        run: pnpm --filter server prisma:generate

      - name: Apply migrations to test DB
        run: pnpm --filter server exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Integration Tests
        run: pnpm --filter server test

      - name: Build all packages
        run: pnpm build

      - name: OpenAPI lint
        run: pnpm --package=@redocly/cli dlx redocly lint docs/openapi.yaml
